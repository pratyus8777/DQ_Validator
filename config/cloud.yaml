mode: cloud

# Cloud mode: Primary=Neon DB, No fallback to local
database:
  primary: neon
  neon:
    enabled: true
    schema: dq_validator
    sample_data_table: sample_policy_data
    rules_table: guidewire_policy_data_cleansing_rules
  
  fallback_on_error: false  # Strict DB-only in cloud

paths:
  sample_data: data/Sample_Policy_Data.csv
  cleansing_rules: data/Guidewire_Policy_DataCleansing_Rules.csv

output:
  dir: output/
  cleansing_rules_json: output/cleansing_rules.json

s3:
  bucket: dq-artifacts
  prefix: dq-inputs/

thresholds:
  remediation_trigger_pct: 0.05

llm:
  enabled: true
  model: gpt-4-turbo

learning:
  type: neondb
  schema: dq_validator
